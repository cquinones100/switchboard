<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Spend</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.scr{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:13px;line-height:17px;white-space:pre}
.scr span{vertical-align:top}
.ln{height:17px;overflow:hidden}
.kitty{position:absolute;left:0;top:0;width:0;height:0}
</style>
</helmet>
<div class="scr" style="width:1280px;height:800px;box-sizing:border-box;padding:16px 0;background:#0b0c12;overflow:hidden;position:relative">
<a href="Index.dc.html" style="position:absolute;top:0;right:16px;font-size:11px;line-height:16px;color:#8d93a8;text-decoration:none">index</a>
<div style="position:relative;display:inline-block;background:#15161e">
<sc-for list="{{rows}}" as="row" hint-placeholder-count="45"><div class="ln"><sc-for list="{{row.runs}}" as="r" hint-placeholder-count="6"><span style="{{r.style}}">{{r.text}}</span></sc-for></div></sc-for>
<div class="kitty"><sc-for list="{{imgs}}" as="im" hint-placeholder-count="0"><div style="{{im.pos}}"><div style="{{im.style}}">{{im.text}}</div></div></sc-for></div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
renderVals() {
const W = 160, H = 45;
const FG = { t: '#c9cdd9', d: '#8d93a8', a: '#5fd7ff', y: '#f2c56b', g: '#7fd18b', b: '#82aaff', r: '#ff8a94', m: '#c49bff', o: '#e0896b', k: '#11131a', L: '#3a3f52', f: '#565b6e', n1: '#8bd5ca', n2: '#f5bde6', n3: '#b7bdf8', n4: '#a6da95', n5: '#f5a97f', n6: '#91d7e3', n7: '#ee99a0', n8: '#c6a0f6', n9: '#e8d5a4' };
const BG = { 0: '#15161e', 1: '#11121a', 2: '#1b1e29', 3: '#20243a', 4: '#262b40', 5: '#2a2e3d', A: '#5fd7ff', Y: '#3a3220', G: '#1d3a2a', B: '#20304f', R: '#3a1d24', M: '#2a2440', H1: '#8bd5ca', H2: '#f5bde6', H3: '#b7bdf8', H4: '#a6da95', H5: '#f5a97f', H6: '#91d7e3', H7: '#ee99a0', H8: '#c6a0f6', H9: '#e8d5a4', D1: '#33504c', E: '#1f2232' };
const g = [];
for (let y = 0; y < H; y++) { const row = []; for (let x = 0; x < W; x++) row.push({ c: ' ', fg: 't', bg: '0', f: '' }); g.push(row); }
const put = (x, y, s, fg, f, bg) => { let i = 0; for (const ch of s) { const xx = x + i; if (y >= 0 && y < H && xx >= 0 && xx < W) { const c = g[y][xx]; g[y][xx] = { c: ch, fg: fg || 't', bg: bg || c.bg, f: f || '' }; } i++; } return i; };
const T = (x, y, ...p) => { for (const q of p) x += typeof q === 'string' ? put(x, y, q) : put(x, y, q[0], q[1], q[2], q[3]); return x; };
const R = (xr, y, s, fg, f, bg) => put(xr - [...s].length + 1, y, s, fg, f, bg);
const fill = (x, y, w, h, bg) => { for (let j = y; j < y + h; j++) for (let i = x; i < x + w; i++) if (j >= 0 && j < H && i >= 0 && i < W) g[j][i] = { c: ' ', fg: 't', bg: bg, f: '' }; };
const hl = (x, y, w, fg, ch) => put(x, y, (ch || '─').repeat(w), fg || 'L');
const vl = (x, y, h, fg) => { for (let j = y; j < y + h; j++) put(x, j, '│', fg || 'L'); };
const clip = (s, n) => [...s].length > n ? [...s].slice(0, n - 1).join('').trimEnd() + '…' : s;
// Key hints, one style everywhere: the key in the accent, what it does dim, two spaces between.
const keys = (x, y, list) => { for (const [k, what] of list) { x += put(x, y, k, 'a'); x += put(x, y, ' ' + what + '  ', 'd'); } return x; };
// A tab header's view keys (M-c Claude ...), the one shown lit.
const view = (x, y, k, label, on) => { if (!k) return put(x, y, ' ' + label + ' ', on ? 't' : 'd', on ? 'b' : '', on ? '4' : '0') + 1; let n = put(x, y, ' ' + k + ' ', on ? 'k' : 'a', 'b', on ? 'A' : '3'); n += put(x + n, y, ' ' + label + ' ', on ? 't' : 'd', on ? 'b' : '', on ? '4' : '0'); return n + 1; };
const views = (x, y, on) => { for (const [k, l] of [['M-c', 'Claude'], ['M-d', 'Diff'], ['M-v', 'PR'], ['', 'Ticket'], ['M-e', 'Note'], ['M-h', 'History'], ['M-\\', 'Beside']]) x += view(x, y, k, l, l === on); };

// KITTY GRAPHICS: what Ghostty draws as images over the cells, in cell units (fractions allowed, so pixels).
// K(x, y, w, h, css, text) places one; css is any extra CSS (background, border-radius, opacity...).
const imgs = [];
// Placed in cells on an outer box in the terminal's font (ch is a cell only in that font); its look, and any font of its own, on an inner one.
const K = (x, y, w, h, css, text) => imgs.push({ pos: 'position:absolute;left:' + (x * 8) + 'px;top:' + (y * 17) + 'px;width:' + (w * 8) + 'px;height:' + (h * 17) + 'px', style: 'width:100%;height:100%;box-sizing:border-box;' + (css || ''), text: text || '', r: [x, y, w, h] });
// ─── THE KIT: the atoms every board draws with ──────────────────────────────
// Tones: t text, d secondary, f faint; a accent (what you can act on, what is chosen);
// y needs you, b working, m landing or queued, g done, r failed. Bold is for names only.
// Surfaces: 0 base, 1 sunken (a screen, a sidebar), 2 panel, E raised (a box), 4 chosen.
// Tints for chips and cells: Y B M G R by tone, 5 neutral.
const TINT = { y: 'Y', b: 'B', m: 'M', g: 'G', r: 'R', d: '5', t: '5', a: '3' };
// MARK: one glyph per state, the same everywhere.
const MARK = { needs: ['●', 'y'], working: ['⠹', 'b'], landing: ['▲', 'm'], queued: ['▲', 'm'], idle: ['○', 'd'], failed: ['✕', 'r'], passed: ['✓', 'g'], pending: ['◌', 'y'], reminder: ['◷', 'y'], mention: ['@', 'b'], note: ['✎', 'm'], comment: ['◇', 'b'], pinned: ['⚑', 'y'] };
const mark = (x, y, state, bg) => put(x, y, MARK[state][0], MARK[state][1], '', bg);
// LABEL: a section's name in capitals, bold, in its tone (d unless it names a state); its count at xr.
const label = (x, y, text, tone, count, xr) => { put(x, y, text.toUpperCase(), tone || 'd', 'b'); if (count !== undefined && xr) R(xr, y, String(count), tone || 'd'); };
// RULE: a solid line between regions; a dashed one only under a table's column heads; a vertical one between panes.
const rule = (x, y, w) => hl(x, y, w, 'L');
const headRule = (x, y, w) => hl(x, y, w, 'L', '┄');
const ruleV = (x, y, h) => vl(x, y, h, 'L');
// ROW: one or two lines of a list; the chosen one gets the chosen surface and an accent bar at its left.
const row = (x, y, w, lines, chosen) => { if (!chosen) return '0'; fill(x, y, w, lines, '4'); for (let j = 0; j < lines; j++) put(x, y + j, '▌', 'a', '', '4'); return '4'; };
// CARD: a rounded box; its mark and name on the top edge at the left, its state at the right; the chosen one's edge in the accent.
const card = (x, y, w, h, o) => {
  const c = o.chosen ? 'a' : 'L';
  put(x, y, '╭', c); hl(x + 1, y, w - 2, c); put(x + w - 1, y, '╮', c);
  vl(x, y + 1, h - 2, c); vl(x + w - 1, y + 1, h - 2, c);
  put(x, y + h - 1, '╰', c); hl(x + 1, y + h - 1, w - 2, c); put(x + w - 1, y + h - 1, '╯', c);
  let n = x + 2; if (o.state) { n += put(n, y, ' '); n += mark(n, y, o.state); }
  n += put(n, y, ' ' + o.title + ' ', o.titleTone || 't', 'b');
  if (o.right) R(x + w - 3, y, ' ' + o.right + ' ', o.rightTone || 'd');
};
// BOX: what a menu, question or the palette is drawn in: raised, its title on the edge, × to close, a shadow under it.
// Call backdrop(boxes) once, last, to dim what is behind every box.
const BOXES = [];
const box = (x, y, w, h, title, tone) => {
  BOXES.push([x, y, w, h, imgs.length]);
  fill(x, y, w, h, 'E');
  const c = tone || 'a';
  put(x, y, '╭', c); hl(x + 1, y, w - 2, c); put(x + w - 1, y, '╮', c);
  vl(x, y + 1, h - 2, c); vl(x + w - 1, y + 1, h - 2, c);
  put(x, y + h - 1, '╰', c); hl(x + 1, y + h - 1, w - 2, c); put(x + w - 1, y + h - 1, '╯', c);
  put(x + 2, y, ' ' + title + ' ', 't', 'b', 'E'); put(x + w - 4, y, ' × ', 'd', '', 'E');
  K(x, y, w, h, 'border-radius:7px;box-shadow:0 14px 34px 8px rgba(0,0,0,.6),0 3px 8px rgba(0,0,0,.45)');
};
const backdrop = () => { for (let i = imgs.length - 1; i >= 0; i--) { const [ix, iy, iw, ih] = imgs[i].r; const under = BOXES.filter((b) => i < b[4]); if (!under.length) continue; if (under.some(([bx, by, bw, bh]) => ix < bx + bw && ix + iw > bx && iy < by + bh && iy + ih > by)) imgs.splice(i, 1); else imgs[i].style += ';opacity:.35'; } for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) { if (BOXES.some(([bx, by, bw, bh]) => x >= bx && x < bx + bw && y >= by && y < by + bh)) continue; const c = g[y][x]; c.fg = 'f'; if (/^(4|A|Y|B|M|G|R|3|5)$/.test(c.bg)) c.bg = '2'; if (c.c === '\uE0B6' || c.c === '\uE0B4') c.fg = '2'; } };
// OPTION: one choice in a box; the chosen one lit, a yellow › before it. Never a letter key: a menu is moved with ↑↓ (or /), chosen with Enter or a click; what sits at the right is a fact, such as a time.
const option = (x, y, w, text, key, chosen) => { const bg = chosen ? '4' : 'E'; if (chosen) fill(x + 1, y, w - 2, 1, '4'); put(x + 2, y, chosen ? '›' : ' ', 'y', 'b', bg); put(x + 4, y, text, 't', chosen ? 'b' : '', bg); if (key) R(x + w - 3, y, key, chosen ? 'a' : 'd', '', bg); };
// KEYCAP: a key you can press or click, with what it does; lit while what it opens is in front.
const keycap = (x, y, k, what, lit) => { if (!k) return put(x, y, ' ' + what + ' ', lit ? 't' : 'd', lit ? 'b' : '', lit ? '4' : '0') + 1; const kb = lit ? 'A' : '3'; let n = put(x, y, '\uE0B6', kb); n += put(x + n, y, k, lit ? 'k' : 'a', 'b', kb); if (lit) { n += put(x + n, y, ' ', 'k', '', kb); n += put(x + n, y, ' ' + what, 't', 'b', '4'); n += put(x + n, y, '\uE0B4', '4'); } else { n += put(x + n, y, '\uE0B4', kb); n += put(x + n, y, ' ' + what + ' ', 'd'); } return n + 1; };
// CHIP: a short fact about a thing, tinted by its tone.
const chip = (x, y, text, tone) => { const t = TINT[tone || 'd']; let n = put(x, y, '\uE0B6', t); n += put(x + n, y, text, tone || 'd', '', t); n += put(x + n, y, '\uE0B4', t); return n + 1; };
// CELL: a step in a pipeline: a chip of fixed width, its text centered, a dim note under it.
const cell = (x, y, w, text, tone, sub) => { const t = TINT[tone]; put(x, y, '\uE0B6', t); fill(x + 1, y, w - 2, 1, t); put(x + w - 1, y, '\uE0B4', t); const n = [...text].length; put(x + Math.floor((w - n) / 2), y, text, tone === 'd' ? 'd' : tone, tone === 'b' || tone === 'r' ? 'b' : '', t); if (sub) { const m = [...sub].length; put(x + Math.floor((w - m) / 2), y + 1, sub, 'd'); } };
// EVENT: something at a time, on a calendar: a block in its tone with a bar at its left, as tall as it lasts on a day's timeline, one row in a month's day; past ones dim and struck through, the chosen one lit.
const event = (x, y, w, h, tone, title, detail, over, chosen) => { const bg = chosen ? '4' : over ? '2' : TINT[tone]; fill(x, y, w, h, bg); for (let j = 0; j < h; j++) put(x, y + j, '▌', chosen ? 'a' : tone, '', bg); put(x + 2, y, [...title].slice(0, w - 2).join(''), over ? 'd' : 't', over ? 's' : 'b', bg); if (detail && h > 1) put(x + 2, y + 1, detail, 'd', '', bg); return bg; };
// PANE: what is chosen, beside a list or a board: its name bold, a dim line of facts, a rule; returns the next row.
const pane = (x, y, w, title, facts) => { put(x, y, title, 't', 'b'); if (facts) T(x, y + 1, ...(typeof facts === 'string' ? [[facts, 'd']] : facts)); rule(x - 1, y + 2, w); return y + 4; };
// IMAGES (kitty graphics): a person's photo, a picture with its caption, a meter.
const PHOTO = { Ana: '#c98a6b', Ben: '#6b8ac9', Priya: '#9a6bc9', Sam: '#6bc99a', Lee: '#c9b06b', Maya: '#c96b8a', Alex: '#6bb5c9', you: '#5f9fd7', You: '#5f9fd7' };
// AVATAR: one person, one color by name whatever the source (Slack, Linear, GitHub): the photo cropped to a circle.
// Large (big) is 4 × 2 beside what the person wrote or did, the text 5 in; Small is 2 × 1 where people are listed inline.
const avatar = (x, y, who, big) => K(x, y + (big ? 0.075 : 0.05), big ? 4 : 2, big ? 1.85 : 0.9, 'border-radius:50%;background:radial-gradient(circle at 50% 38%,rgba(255,255,255,.35) 0 22%,transparent 23%),radial-gradient(ellipse at 50% 100%,rgba(255,255,255,.3) 0 45%,transparent 46%),' + (PHOTO[who] || '#7a7f94'));
const picture = (x, y, w, h, caption) => { K(x, y, w, h, 'box-sizing:border-box;border:1px solid #3a3f52;border-radius:6px;background:#11121a'); if (caption) put(x, Math.ceil(y + h), caption, 'd'); };
// A meter may carry a tick: a target or a pace to compare the value with.
const meter = (x, y, w, frac, color, tick) => { K(x, y + 0.35, w, 0.3, 'border-radius:3px;background:#3a3f52'); K(x, y + 0.35, w * Math.max(0, Math.min(1, frac)), 0.3, 'border-radius:3px;background:' + color); if (tick !== undefined) K(x + w * tick - 0.1, y + 0.1, 0.2, 0.8, 'border-radius:1px;background:#c9cdd9'); };
// SERIES: a quantity over time at pixel resolution, as bars: a chart several rows tall, or a sparkline one row tall inside a row.
// values: numbers, or arrays of [number, color] stacked; max: the top of the scale; over: values past it drawn in the failed tone.
const series = (x, y, w, h, values, color, max, over) => { const bw = w / values.length; values.forEach((v, i) => { let base = y + h; for (const [n, c] of (Array.isArray(v) ? v : [[v, color]])) { const bh = Math.min(h, n / max * h); if (bh <= 0) continue; base -= bh; K(x + i * bw + bw * 0.12, base, bw * 0.76, bh, 'border-radius:1.5px;background:' + (over !== undefined && n > over ? '#ff8a94' : c)); } }); };
// INPUT: a line you type into: › in the accent, what is typed (or a faint placeholder) and a cursor, its keys at the right.
const input = (x, y, w, text, placeholder, hints) => { put(x, y, '\uE0B6', '2'); fill(x + 1, y, w - 2, 1, '2'); put(x + w - 1, y, '\uE0B4', '2'); put(x + 1, y, '›', 'a', 'b', '2'); if (text) { const n = put(x + 3, y, text, 't', '', '2'); put(x + 3 + n, y, '▏', 'a', '', '2'); } else { put(x + 3, y, '▏', 'a', '', '2'); put(x + 4, y, placeholder || '', 'f', '', '2'); } if (hints) { const len = hints.reduce((m, [k, wd]) => m + [...k].length + [...wd].length + 3, 0); keys(x + w - len, y, hints); } };
// ─────────────────────────────────────────────────────────────────────────────

// THE SIDEBAR, the same on every board: sel is the number of the tab under the cursor, or 0.
const sidebar = (sel, opts) => {
  opts = opts || {};
  fill(0, 0, 34, 45, '1');
  T(1, 0, ['9 tabs', 'd']); R(32, 0, '/ filter', 'd');
  T(1, 2, ['NOTIFICATIONS', 'a', 'b']); R(32, 2, '5', 'a');
  const note = (y, glyph, gc, text, when) => { T(2, y, [glyph, gc], ' ', text); R(32, y, when, 'd'); };
  note(3, '✓', 'g', 'Landed 8e1f2a7', '1m');
  note(4, '◷', 'y', 'Design review → 3:00', '12m');
  note(5, '✓', 'g', 'PR 212 merged', '40m');
  note(6, '@', 'b', 'Ana mentioned you', '1h');
  note(7, '✎', 'm', 'Standup note written', '9h');
  const tab = (y, glyph, gc, num, name, sub) => { const s = num === sel; if (s) { fill(0, y, 34, 2, '4'); put(0, y, '▌', 'a'); put(0, y + 1, '▌', 'a'); } T(2, y, [glyph, gc], ' ', [String(num), 'n' + num], ' ', [name, 't', s ? 'b' : '']); put(6, y + 1, sub, 'd'); };
  T(1, 9, ['NEEDS YOU', 'y', 'b']); R(32, 9, '3', 'y');
  tab(10, '●', 'y', 2, 'stable note IDs', 'Bash: git push origin main');
  tab(12, '●', 'y', 6, 'review PR 41', 'asks: which fixture?');
  tab(14, '●', 'y', 4, 'full titles', 'tests failed: 2 of 401');
  T(1, 17, ['WORKING', 'b', 'b']); R(32, 17, '3', 'b');
  tab(18, '⠹', 'b', 1, 'planning', 'Monitor: fork parity');
  tab(20, '⠹', 'b', 3, 'M-d uncommitted', 'Edit diffview.lua');
  tab(22, '⠼', 'b', 7, 'Rust port notes', 'Read upgrade.rs');
  T(1, 25, ['LANDING', 'm', 'b']); R(32, 25, '1', 'm');
  tab(26, '▲', 'm', 5, 'benchmark harness', '2nd in the landing queue');
  T(1, 29, ['IDLE', 'd', 'b']); R(32, 29, '2', 'd');
  tab(30, '○', 'd', 8, 'handoff', 'idle 58m');
  tab(32, '○', 'd', 9, 'oncall watch', 'idle 14m');
  keys(1, 44, [['M-t', 'new'], ['M-j', 'jump'], ['M-a', 'next']]);
  vl(34, 0, 45);
};

// MISSION CONTROL'S BAR: its views grouped by feature. Row 0: the groups, the one in front lit;
// row 1: that group's views, the one in front lit; row 2: a rule. The content starts at row 3.
const GROUPS = [['Work', ['Tabs', 'Landing', 'Autopilot', 'Routines', 'Reopen']], ['Code', ['PRs', 'Tickets', 'CI']], ['Day', ['Calendar', 'Reminders', 'Slack', 'Inbox', 'Notifications']], ['System', ['Usage', 'Resources', 'Settings', 'Keys']]];
const mcBar = (group, current, right) => {
  fill(35, 0, 125, 1, '3');
  let x = T(36, 0, ['Mission control', 't', 'b', '3']) + 3;
  for (const [name] of GROUPS) { const on = name === group; if (on) { put(x, 0, '\uE0B6', 'A'); put(x + 1, 0, name, 'k', 'b', 'A'); put(x + 1 + [...name].length, 0, '\uE0B4', 'A'); x += [...name].length + 3; } else x += put(x, 0, ' ' + name + ' ', 'd', '', '3') + 1; }
  R(158, 0, right || '', 'd', '', '3');
  x = 36;
  for (const v of GROUPS.find((q) => q[0] === group)[1]) { const on = v === current; if (on) { put(x - 1, 1, '\uE0B6', '4'); put(x, 1, v, 'a', 'b', '4'); put(x + [...v].length, 1, '\uE0B4', '4'); } else put(x, 1, v, 'd'); x += [...v].length + 3; }
  let rx = 158; const hint = [['M-[ M-]', 'groups'], ['[ ]', 'views'], ['Esc', 'back']];
  rx -= hint.reduce((n, [k, w]) => n + k.length + w.length + 3, 0) - 2; keys(rx + 1, 1, hint);
  hl(35, 2, 125);
};

// MISSION CONTROL'S VIEWS IN THE SIDEBAR (board 64, the default; board 65 with "Keep the tabs sidebar in mission control" on):
// while mission control is open the sidebar lists its groups and views, each saying what it would show; the view in front lit.
// The view takes the whole height under one header line: its name, its group, and its facts at the right.
const FACTS = { Tabs: ['3 need you', 'y'], Landing: ['1', 'm'], Autopilot: ['2 working', 'b'], Routines: ['next 9:00', 'd'], Reopen: ['5', 'd'], Map: ['14', 'd'], PRs: ['5 open', 'd'], Tickets: ['3', 'd'], CI: ['1 failing', 'r'], Calendar: ['next 3:00', 'd'], Reminders: ['1', 'y'], Slack: ['2 new', 'a'], 'Slack relay': ['on', 'g'], Inbox: ['4 unread', 'a'], Notifications: ['5', 'a'], Usage: ['$8.41', 'd'], Extras: ['1 of 7 on', 'd'] };
const navBar = (group, current, right) => {
  const core = GROUPS.length < 4, need = core ? '1 needs you' : '3 need you';
  fill(0, 0, 34, H, '1'); vl(34, 0, H);
  T(1, 0, ['‹ ', 'a'], ['Tabs', 'd'], ['  ·  ', 'f'], [need, 'y']); R(32, 0, '/ filter', 'd');
  T(1, 2, ['MISSION CONTROL', 'a', 'b']);
  let sy = 4;
  for (const [gr, vs] of GROUPS) {
    T(1, sy, [gr.toUpperCase(), 'd', 'b']); sy++;
    for (const v of vs) { const sel = v === current; const bg = sel ? row(0, sy, 34, 1, true) : '1'; put(3, sy, v, 't', sel ? 'b' : '', bg); const f = v === 'Tabs' ? [need, 'y'] : FACTS[v]; if (f) R(32, sy, f[0], f[1], '', bg); sy++; }
    sy++;
  }
  keys(1, 44, [['j/k', 'view'], ['Enter', 'open'], ['Esc', 'tabs']]);
  fill(35, 0, 125, 2, '0');
  T(36, 0, [current, 't', 'b'], ['   ' + group, 'd']); if (right) R(158, 0, right, 'd');
  hl(35, 1, 125);
};

// ─── THE BOARD ───────────────────────────────────────────────────────────────
// MISSION CONTROL'S VIEWS IN THE SIDEBAR (board 64), FACTORY BETWEEN WORK AND CODE: Autopilot, Landing and Routines moved from Work,

const VIEWS = [
  ['Work', [['Tabs', '3 need you', 'y'], ['Map', '14', 'd'], ['Reopen', '5', 'd']]],
  ['Factory', [['Autopilot', '2 working', 'b'], ['Spend', '$14.62 of $20', 'y'], ['Limits', 'out at 4:05', 'y'], ['Landing', '1 · 1 queued', 'm'], ['Routines', 'next 3:00', 'd'], ['Resources', '41 GB', 'd']]],
  ['Code', [['PRs', '5 open', 'd'], ['Tickets', '3', 'd'], ['CI', '1 failing', 'r']]],
  ['Day', [['Calendar', 'next 3:00', 'd'], ['Reminders', '1', 'y'], ['Slack', '2 new', 'a'], ['Inbox', '4 unread', 'a'], ['Notifications', '5', 'a']]],
  ['System', [['Settings', '', 'd'], ['Keys', '', 'd']]],
];
const navSidebar = (current) => {
  fill(0, 0, 34, H, '1'); vl(34, 0, H);
  T(1, 0, ['‹ ', 'a'], ['Tabs', 'd'], ['  ·  ', 'f'], ['3 need you', 'y']); R(32, 0, '/ filter', 'd');
  T(1, 2, ['MISSION CONTROL', 'a', 'b']);
  let sy = 4;
  for (const [gr, vs] of VIEWS) {
    T(1, sy, [gr.toUpperCase(), gr === 'Factory' ? 'a' : 'd', 'b']); sy++;
    for (const [v, fact, tone] of vs) { const sel = v === current; const bg = sel ? row(0, sy, 34, 1, true) : '1'; put(3, sy, v, 't', sel ? 'b' : '', bg); if (fact) R(32, sy, fact, tone, '', bg); sy++; }
    sy++;
  }
  keys(1, 44, [['j/k', 'view'], ['Enter', 'open'], ['Esc', 'tabs']]);
};
const viewHead = (name, facts, right) => { T(36, 0, [name, 't', 'b'], ['   ' + facts, 'd']); if (right) R(158, 0, right, 'd'); hl(35, 1, 125); };
const footer = () => keys(36, 44, [['j/k', 'move'], ['Enter', 'actions'], ['m', 'view actions'], ['/', 'filter'], ['Tab', 'the views']]);

// MISSION CONTROL'S SPEND (Factory): every dollar today, Claude's, Codex's, the Haiku no tab shows and CI's, against a daily budget that pauses autopilot.
const SEL = 0;
navSidebar('Spend');
viewHead('Spend', 'Factory · Friday, November 6 · 2:15', 'at API prices; CI at GitHub\'s per-minute rates');

// Today against the budget: the meter's tick is where this pace ends the day.
T(37, 3, ['Today', 't', 'b'], '  ', ['$14.62', 't', 'b'], [' of the $20 budget', 'd']);
meter(70, 3, 38, 14.62 / 20, '#f2c56b', 0.99);
T(110, 3, ['at this pace $19.80 by 6:00', 'y']);
R(158, 4, 'over it, autopilot takes no new item', 'd');
const SVC = [['Claude', '#82aaff', 9.18], ['Codex', '#c49bff', 1.40], ['Haiku, hidden', '#8bd5ca', 0.62], ['CI', '#f5a97f', 3.42]];
let cx = 37; for (const [n, c, v] of SVC) { K(cx, 4.3, 1, 0.45, 'border-radius:2px;background:' + c); cx += 2; cx = T(cx, 4, [n + ' ', 'd'], ['$' + v.toFixed(2), 't']) + 3; }

// The spend chart: the kit's series, stacked by service, on a dashed grid; now in red.
const BINS = 21;
const bins = SVC.map(([, c, v], k) => { const w = []; for (let i = 0; i < BINS; i++) { const lunch = i === 12 || i === 13 ? 0.25 : 1; const ci = k === 3 ? (i % 4 === 1 ? 2.4 : 0.2) : 1; w.push((1 + 0.6 * Math.sin(i * 0.9 + k * 1.7)) * lunch * ci * (k === 0 && i >= 18 ? 1.9 : 1)); } const s = w.reduce((a, b) => a + b, 0); return w.map((x) => [x / s * v, c]); });
const stacks = Array.from({ length: BINS }, (_, i) => bins.map((b) => b[i]));
const top = 1.6, X = 43, Y = 7.5, CW = 75.6, CH = 9;
label(37, 6, 'Spend by quarter hour');
[0, 0.5, 1].forEach((f) => { K(X, Y + CH - f * CH, CW, 0.06, f === 0 ? 'background:#3a3f52' : 'background:repeating-linear-gradient(90deg,#3a3f52 0 3px,transparent 3px 6px)'); R(X - 2, Math.round(Y + CH - f * CH - 0.5), f === 0 ? '$0' : '$' + (top * f).toFixed(2), 'd'); });
series(X, Y, CW, CH, stacks, null, top);
const bw = CW / BINS;
K(X + BINS * bw - 0.6, Y - 0.4, 0.12, CH + 0.4, 'background:#ff8a94'); put(Math.round(X + (BINS - 1) * bw - 1), Math.floor(Y - 1), 'now', 'r');
[['9:00', 0], ['10:00', 4], ['11:00', 8], ['12:00', 12], ['1:00', 16], ['2:00', 20]].forEach(([t, i]) => put(Math.round(X + i * bw), Math.ceil(Y + CH), t, 'd'));

// By: one list, grouped as the view's m menu sets (tab, item, routine, model, service); a row over its hourly limit is marked.
label(124, 6, 'By tab'); R(158, 6, 'an hour', 'd');
const BY = [[7, 'Rust port notes', 3.81, '$3.20', 'r'], [1, 'planning', 2.86, '$0.70', 'd'], [3, 'M-d uncommitted', 1.60, '$0.40', 'd'], [6, 'review PR 41', 1.09, '$0.55', 'd'], [2, 'stable note IDs', 0.84, '—', 'f']];
BY.forEach(([n, name, v, h, tone], k) => {
  const y = 8 + k * 2, bg = row(123, y, 37, 1, k === SEL);
  T(125, y, [String(n), 'n' + n, '', bg], [' ' + clip(name, 15), 't', 'b', bg]);
  R(149, y, '$' + v.toFixed(2), 't', '', bg);
  R(158, y, h, tone, tone === 'r' ? 'b' : '', bg);
});
T(125, 18, ['✕ ', 'r'], ['tab 7 is over $3 an hour', 'r']);

// Where it went: each source, how much and what it is made of.
rule(36, 20, 124);
label(37, 21, 'Where it went'); R(96, 21, 'today', 'd');
const SRC = [
  ['Claude, in tabs', '9 tabs · sonnet 92%, opus 8%', 8.41, '#82aaff'],
  ['Claude, routines', '3 runs · standup note, todo, Slack', 0.77, '#82aaff'],
  ['Codex', '12 review rounds over 5 items', 1.40, '#c49bff'],
  ['Haiku no tab shows', '214 calls: connectors 120 · stories 41 · relay 38 · names 15', 0.62, '#8bd5ca'],
  ['GitHub Actions', 'macOS 31 min at 10× · Linux 26 min · private repos only', 3.42, '#f5a97f'],
];
SRC.forEach(([n, sub, v, c], k) => {
  const y = 23 + k * 2;
  put(37, y, n, 't', 'b'); put(37, y + 1, clip(sub, 58), 'd');
  meter(60, y, 26, v / 9.18, c);
  R(96, y, '$' + v.toFixed(2), 't', 'b');
});

// Per landed item: Claude, Codex and CI for each item ticked today.
ruleV(98, 21, 22);
label(100, 21, 'Per landed item'); R(158, 21, 'avg $2.90 this week', 'd');
T(100, 22, ['item', 'd']); R(132, 22, 'Claude', 'd'); R(140, 22, 'Codex', 'd'); R(147, 22, 'CI', 'd'); R(158, 22, 'total', 'd'); headRule(100, 23, 59);
const ITEMS = [['Keep note IDs', 2.10, 0.40, 0.31], ['Settings page layout', 3.65, 0.62, 1.84], ['Relative line numbers', 1.22, 0.18, 0.31], ['Drag a capped pane\'s edge', 0.96, 0.20, 0.31]];
ITEMS.forEach(([n, a, b, c], k) => { const y = 24 + k; put(100, y, clip(n, 24), 't'); R(132, y, '$' + a.toFixed(2), 'd'); R(140, y, '$' + b.toFixed(2), 'd'); R(147, y, '$' + c.toFixed(2), 'd'); R(158, y, '$' + (a + b + c).toFixed(2), 't', 'b'); });

// Waiting to resume: idle tabs whose context is past the cache, so the next prompt writes it all again.
label(100, 30, 'Waiting to resume');
const IDLE = [[8, 'handoff', '180k context', '≈ $0.68'], [2, 'stable note IDs', '92k context', '≈ $0.35']];
IDLE.forEach(([n, name, ctx, cost], k) => { const y = 31 + k; mark(100, y, n === 2 ? 'needs' : 'idle'); T(102, y, [String(n), 'n' + n], ' ', name, ['  ' + ctx, 'd']); R(158, y, cost, 'y'); });
T(100, 33, ['the cache lasts an hour; a /compact first costs less', 'd']);

// Fixed costs: what you pay whatever you use, against what the month would cost at API prices.
label(100, 35, 'Fixed costs'); R(158, 35, 'this month', 'd');
T(100, 36, ['Claude Max ', 'd'], '$200', ['  GitHub ', 'd'], '$4', ['  Linear ', 'd'], '$10');
T(100, 37, ['at API prices, the month so far: ', 'd'], ['$412', 'g', 'b']);
T(100, 39, ['prices you set in Settings › Factory', 'f']);

T(37, 34, ['Hidden calls: the ', 'd'], ['claude -p', 't'], [' runs Switchboard starts for itself,', 'd']);
T(37, 35, ['counted by the request audit and priced from each run\'s JSON', 'd']);
footer();

// ─────────────────────────────────────────────────────────────────────────────

// Lines and blocks are drawn to fill the cell, as Ghostty draws them, not taken from the font.
const LINE = { '\uE0B6': ['cap', 'l'], '\uE0B4': ['cap', 'r'], '─': ['h', 1], '━': ['h', 2], '┄': ['hd'], '│': ['v'], '┆': ['vd'], '╭': ['arc', 'rb'], '┌': ['c', 'rb'], '╮': ['arc', 'lb'], '┐': ['c', 'lb'], '╰': ['arc', 'rt'], '└': ['c', 'rt'], '╯': ['arc', 'lt'], '┘': ['c', 'lt'], '█': ['f'], '▌': ['lh'], '▁': ['lo'], '▐': ['rh'], '┼': ['x'], '├': ['j', 'r'], '┤': ['j', 'l'], '┬': ['j', 'b'], '┴': ['j', 't'] };
const draw = (ch, col) => { const k = LINE[ch]; const lg = 'linear-gradient(' + col + ',' + col + ')'; if (k[0] === 'cap') return ['radial-gradient(100% 50% at ' + (k[1] === 'l' ? '100%' : '0%') + ' 50%, ' + col + ' 98%, transparent 100%)', '100% 100%', 'center']; if (k[0] === 'arc') { /* Ghostty draws ╭ ╮ ╰ ╯ as quarter-circle arcs from the middle of one edge to the middle of the next */ const cx = k[1][0] === 'r' ? '100%' : '0%', cy = k[1][1] === 'b' ? '100%' : '0%'; return ['radial-gradient(50% 50% at ' + cx + ' ' + cy + ', transparent calc(100% - 1.2px), ' + col + ' calc(100% - 1.2px), ' + col + ' 100%, transparent 100%)', '100% 100%', 'center']; } if (k[0] === 'h') return [lg, '100% ' + k[1] + 'px', 'center']; if (k[0] === 'hd') return ['repeating-linear-gradient(90deg,' + col + ' 0 3px,transparent 3px 5px)', '100% 1px', 'center']; if (k[0] === 'v') return [lg, '1px 100%', 'center']; if (k[0] === 'vd') return ['repeating-linear-gradient(' + col + ' 0 4px,transparent 4px 7px)', '1px 100%', 'center']; if (k[0] === 'f') return [lg, '100% 100%', 'center']; if (k[0] === 'lh') return [lg, '50% 100%', 'left center']; if (k[0] === 'lo') return [lg, '100% 3px', 'center bottom']; if (k[0] === 'rh') return [lg, '50% 100%', 'right center']; if (k[0] === 'x') return [lg + ',' + lg, '100% 1px,1px 100%', 'center,center']; if (k[0] === 'j') { const d = k[1]; if (d === 'r' || d === 'l') return [lg + ',' + lg, '1px 100%,calc(50% + 0.5px) 1px', 'center,' + (d === 'r' ? 'right' : 'left') + ' center']; return [lg + ',' + lg, '100% 1px,1px calc(50% + 0.5px)', 'center,center ' + (d === 'b' ? 'bottom' : 'top')]; } if (k[0] === 't') return [lg + ',' + lg, '100% 1px,1px calc(50% + 0.5px)', 'center,center ' + (k[1] === 'b' ? 'bottom' : 'top')]; if (k[0] === 'x') return [lg + ',' + lg, '100% 1px,1px 100%', 'center,center']; const hx = k[1][0] === 'r' ? 'right' : 'left', vy = k[1][1] === 'b' ? 'bottom' : 'top'; return [lg + ',' + lg, 'calc(50% + 0.5px) 1px,1px calc(50% + 0.5px)', hx + ' center,center ' + vy]; };
const lineRun = (q) => { const d = draw(q.ch, FG[q.fg] || BG[q.fg]); return { text: '', style: 'display:inline-block;vertical-align:top;width:' + (q.n * 8) + 'px;height:17px;background-color:' + BG[q.bg] + ';background-image:' + d[0] + ';background-size:' + d[1] + ';background-position:' + d[2] + ';background-repeat:no-repeat' }; };
const SAFE = /[\x20-\x7e]/;
const rows = g.map((row) => { const runs = []; let cur = null; for (const c of row) { const ln = LINE[c.c]; const odd = !ln && !SAFE.test(c.c); const key2 = (ln ? 'L' + c.c : '') + c.fg + '|' + c.bg + '|' + c.f; const joins = !ln || ln[0] === 'h' || ln[0] === 'hd' || ln[0] === 'f'; if (!odd && cur && !cur.odd && cur.key === key2 && joins) { cur.text += c.c; cur.n++; } else { cur = { key: key2, odd: odd, ln: ln, ch: c.c, n: 1, text: c.c, fg: c.fg, bg: c.bg, f: c.f }; runs.push(cur); } } return { runs: runs.map((q) => q.ln ? lineRun(q) : ({ text: q.text, style: 'color:' + FG[q.fg] + ';background:' + BG[q.bg] + (q.f.indexOf('b') >= 0 ? ';-webkit-text-stroke:0.5px currentColor' : '') + (q.f.indexOf('s') >= 0 ? ';text-decoration:line-through' : '') + (q.f.indexOf('u') >= 0 ? ';text-decoration:underline' : '') + (q.odd ? ';display:inline-block;width:8px;height:17px;text-align:center;overflow:hidden' : ';display:inline-block;vertical-align:top;width:' + (q.n * 8) + 'px;height:17px;overflow:hidden;white-space:pre;letter-spacing:calc(8px - 1ch)') })) }; });
return { rows: rows, imgs: imgs };
}
}
