<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Index</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#c9cdd9;text-decoration:none}
a:hover{color:#ffffff;background:#262b40}
a:focus{outline:none;color:#ffffff;background:#262b40;box-shadow:inset 3px 0 0 #5fd7ff}
a:focus .num,a:hover .num{color:#5fd7ff}
</style>
</helmet>
<div style="width:1280px;height:800px;box-sizing:border-box;padding:40px 48px;background:#15161e;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:13px;line-height:17px;color:#c9cdd9;display:flex;flex-direction:column;gap:26px">
<div style="display:flex;align-items:baseline;gap:16px">
<h1 style="margin:0;font-size:13px;font-weight:700;color:#c9cdd9">Index</h1>
<p style="margin:0;color:#8d93a8">every board by feature · Tab to one, Enter to go there · each board links back here at its top right</p>
</div>
<div style="columns:3;column-gap:40px">
<sc-for list="{{groups}}" as="g" hint-placeholder-count="7">
<section style="display:flex;flex-direction:column;gap:2px;break-inside:avoid;margin-bottom:16px">
<h2 style="margin:0 0 2px 0;font-size:13px;font-weight:700;letter-spacing:0;color:#8d93a8">{{g.label}}</h2>
<p style="margin:0 0 8px 0;color:#565b6e">{{g.about}}</p>
<sc-for list="{{g.boards}}" as="b" hint-placeholder-count="4">
<a href="{{b.file}}" title="{{b.num}}. {{b.title}}" style="display:flex;gap:12px;padding:1px 8px;border-radius:4px"><span class="num" style="color:#8d93a8;width:3ch;text-align:right;flex:none">{{b.num}}</span><span style="min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">{{b.title}}</span></a>
</sc-for>
</section>
</sc-for>
</div>
</div>
</x-dc>

","title":"Finding a key, from the Keys view's m menu: press it to find its binding"},{"file":"RemindBox.dc.html","num":"34","title":"Setting or changing a tab's reminder: when, typed or picked, and what for"},{"file":"AutopilotBox.dc.html","num":"35","title":"Autopilot's settings: one list moved with ↑↓, a pause button, what the chosen row does said once, changes applied as made"},{"file":"StartItem.dc.html","num":"36","title":"Working on a note's item: its repository, the branch it lands on, or autopilot's queue"},{"file":"CalendarItemMenu.dc.html","num":"54","title":"Enter in any mission control view: the chosen item's actions in a menu, here a calendar event's"},{"file":"CalendarViewMenu.dc.html","num":"55","title":"m in any mission control view: the view's own actions in a menu, here Calendar's"}]},{"label":"CORE AND EXTRAS","about":"what a newcomer starts on and turns on","boards":[{"file":"Extras.dc.html","num":"37","title":"Extras: each bundle one switch, with what it adds and what it needs"},{"file":"CoreOnly.dc.html","num":"38","title":"Core only: the workspace as a newcomer first sees it"},{"file":"CoreMission.dc.html","num":"39","title":"Core only: mission control's Tabs, its bar Work and System alone"},{"file":"FirstRun.dc.html","num":"40","title":"The first run: switchboard setup ends by naming the extras"},{"file":"FirstOpen.dc.html","num":"41","title":"Switchboard's first open: one tab of Claude, and the welcome tip"},{"file":"ExtraTip.dc.html","num":"42","title":"A tip suggesting an extra the first time it fits: a tab's Claude opens a PR"}]},{"label":"SLACK ON A PHONE","about":"the relay's DM, threads and Home tab","boards":[{"file":"SlackDm.dc.html","num":"46","title":"Slack on a phone: the DM, one line for each thing that needs you"},{"file":"SlackThread.dc.html","num":"47","title":"A tab's thread on a phone: a permission prompt answered with buttons"},{"file":"SlackHome.dc.html","num":"48","title":"The Home tab on a phone, grouped as the sidebar"},{"file":"SlackScreen.dc.html","num":"49","title":"A tab's screen, opened from Home"},{"file":"SlackHomeNext.dc.html","num":"50","title":"Proposed: Home with Next, the desktop's state colors and today's usage"},{"file":"SlackLanding.dc.html","num":"51","title":"Proposed: landing in the tab's thread, queue-and-clean's steps and its push question as buttons"},{"file":"SlackAutopilot.dc.html","num":"52","title":"Proposed: autopilot's settings as a Slack form that also starts it"}]}];
return { groups: groups };
}
}
</script>
</body>
</html>
