# cargo-deny's settings, for CI's `cargo deny check advisories`, which fails
# a run whose Cargo.lock holds a crate with a RustSec advisory. Only the
# advisories are checked; licenses, bans and sources aren't.

[advisories]
# cargo-deny ignores an advisory by its ID; a crate name here would ignore
# only a yanked version.
ignore = [
  { id = "RUSTSEC-2025-0141", reason = "bincode is unmaintained, informational only; syntect brings it in" },
  { id = "RUSTSEC-2024-0320", reason = "yaml-rust is unmaintained, informational only; syntect brings it in" },
]
