# tmux's config with Switchboard on a tmux server of its own (the tmux_server
# setting): setup.sh links ~/.config/tmux/tmux.conf here in place of
# Switchboard's tmux.conf. tmux reads that file whenever any tmux server
# starts, so this loads Switchboard only on the server named switchboard
# (tmux -L switchboard), and every other tmux server you start stays plain
# tmux, reading only your own ~/.tmux.conf. A reload (source-file of this
# file) on Switchboard's server loads it again.
%if "#{m:*/switchboard,#{socket_path}}"
source-file ~/switchboard/tmux/tmux.conf
%else
# The setting changed back to tmux's default server by hand while tmux was
# closed: Switchboard loads here then, as it did before, and its settings.sh
# links ~/.config/tmux/tmux.conf back to tmux.conf for the next start.
if-shell 'test "$(~/.config/tmux/switchboard-tmux.sh --name)" = default' 'source-file ~/switchboard/tmux/tmux.conf'
%endif
