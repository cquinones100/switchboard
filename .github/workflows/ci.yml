# Every pull request, merged into main, and every push to main, so a PR's
# commit runs once (its branch's own push would run the same jobs again, on
# the few macOS runners the account has) and main still runs after each
# merge. The jobs run side by side so a run takes as long as its slowest:
# the formatting checked; on x86_64 Linux clippy with its warnings as
# errors (with the net feature and without it, the build that type-checks
# macOS's paths from Linux) and the tests, in jobs of their own;
# and on an Apple silicon Mac a job running the same clippy and building the
# tests into an archive, whose tests two jobs then run half each: three
# macOS jobs a run, since the account runs few at once, while the whole
# suite on one small Mac took 15 minutes and timed out tests waiting on the
# screen. Intel Macs are
# left to the release, which builds their archive itself. nextest is CI's
# alone: on the computer the tests are `cargo test`, and the Linux job checks
# that nextest lists as many tests as it.
# The Rust is the one rust-toolchain.toml pins, installed by rustup as that
# file says. Each job keeps its own cache of cargo's registry and the
# dependencies' builds (Swatinem/rust-cache), keyed on the toolchain,
# Cargo.lock, the manifests' profiles and the environment, and saved again
# whenever that key changes. The tests run on 8 threads whatever the
# runner's cores, since most of them wait on a deadline rather than
# compute, and `common::patience()` stretches the deadlines with the load
# that adds.
# A first job sorts a pull request by the files it changes against its base
# (the merge commit's first parent): light, when every file is
# documentation (docs/, ARCHITECTURE.md, CLAUDE.md, the READMEs) or a skill
# (assets/skills/, .claude/skills/), which the code compiles in or the
# tests read, so the Linux jobs run on them still; full, for anything else,
# and every push to main or to a merge queue's ci/train-* branch, which adds
# the three macOS jobs. A macOS job skips
# itself by its own `if:`, never by a path filter on `on:`, so each of the
# six checks main requires still reports, skipped counting as passing; the
# macOS tests are two jobs rather than a matrix, since a matrix job skipped
# reports under its name unexpanded. The formatting job fails when the sort
# does, so a broken sort can't skip the macOS checks into a merge.

name: CI

on:
  push:
    # A train of Switchboard's merge queue (src/merge_queue) runs every job
    # on the PRs it tests together, merged onto main.
    branches: [main, "ci/train-*"]
  pull_request:

permissions:
  contents: read

# A newer push to the same branch or pull request makes an older run moot.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  changes:
    name: Sort the changes
    runs-on: ubuntu-latest
    outputs:
      kind: ${{ steps.sort.outputs.kind }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 2
      - name: Sort the run into light or full
        id: sort
        # A rename is listed as the file it removes and the one it adds, so a
        # file moved out of src/ still counts as touching src/.
        run: |
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            echo "kind=full" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(git diff --name-only --no-renames HEAD^1 HEAD)
          kind=light
          while IFS= read -r file; do
            [ -n "$file" ] || continue
            if ! [[ "$file" == docs/* || "$file" == ARCHITECTURE.md || "$file" == CLAUDE.md \
              || "$file" == assets/skills/* || "$file" == .claude/skills/* \
              || "$file" == README.md || "$file" =~ ^crates/[^/]+/README\.md$ ]]; then
              echo "$file needs every job"
              kind=full
              break
            fi
          done <<< "$files"
          echo "Kind: $kind"
          echo "kind=$kind" >> "$GITHUB_OUTPUT"

  fmt:
    name: Formatting
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Check that the changes were sorted
        if: needs.changes.result != 'success'
        run: |
          echo "Sorting the changes failed, so the macOS jobs were skipped without a reason"
          exit 1
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - run: cargo fmt --all --check

  clippy:
    name: Clippy (Linux x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: clippy
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Clippy without the net feature
        run: cargo clippy --locked --all-targets --no-default-features -- -D warnings

  test-linux:
    name: Tests (Linux x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: test
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-nextest
      - name: Check that nextest runs every test cargo test would
        # nextest runs no doctests and only what the test harness lists, so a
        # test it would leave out fails here rather than going unrun.
        run: |
          by_nextest=$(cargo nextest list --locked --run-ignored all --message-format oneline | wc -l)
          by_cargo=$(cargo test --locked -- --list --format terse 2>/dev/null | grep -c ': test$')
          echo "nextest lists $by_nextest tests, cargo test $by_cargo"
          test "$by_nextest" -eq "$by_cargo"
      - name: Tests
        # Every test in a process of its own, each running whatever one before
        # it failed, so a run names every failure rather than the first.
        run: cargo nextest run --locked --no-fail-fast --test-threads 8

  build-macos:
    name: Build the tests (macOS arm64)
    needs: changes
    if: needs.changes.outputs.kind == 'full'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: macos
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-nextest
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Clippy without the net feature
        run: cargo clippy --locked --all-targets --no-default-features -- -D warnings
      - name: Build the test binaries into an archive
        run: cargo nextest archive --locked --archive-file tests.tar.zst
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos-tests
          path: tests.tar.zst
          retention-days: 1

  test-macos-1:
    name: Tests (macOS arm64, 1 of 2)
    needs: [changes, build-macos]
    if: needs.changes.outputs.kind == 'full'
    runs-on: macos-latest
    env:
      PARTITION: 1
    steps: &test-macos-steps
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-nextest
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: macos-tests
      - name: Tests
        # The archive is unpacked into the checkout's own target/, the path
        # it was built at, since the tests find the binary by the path cargo
        # compiled into them (CARGO_BIN_EXE_switchboard).
        run: >
          cargo nextest run --archive-file tests.tar.zst
          --workspace-remap . --extract-to . --extract-overwrite
          --partition count:${{ env.PARTITION }}/2
          --no-fail-fast --test-threads 8

  test-macos-2:
    name: Tests (macOS arm64, 2 of 2)
    needs: [changes, build-macos]
    if: needs.changes.outputs.kind == 'full'
    runs-on: macos-latest
    env:
      PARTITION: 2
    steps: *test-macos-steps
