# Every push and pull request, in jobs that run side by side so a run takes
# as long as its slowest: the formatting checked; clippy with its warnings as
# errors (with the net feature and without it, the build that type-checks
# macOS's paths from Linux) and the tests, each a job of its own on x86_64
# Linux and on an Apple silicon Mac; and a build for Intel Macs
# cross-compiled on the same Mac by its own toolchain, left out on a
# landing's own `ci/land-*` branch (main and pull requests still build it, and
# the release builds it itself), since a landing waits on clippy and the
# tests alone and the account's macOS jobs are few. The Rust is the one
# rust-toolchain.toml pins, installed by rustup as that file says. Each job
# keeps its own cache of cargo's registry and the dependencies' builds
# (Swatinem/rust-cache), keyed on the toolchain, Cargo.lock, the manifests'
# profiles and the environment, and saved again whenever that key changes.
# The tests run on 8 threads whatever the runner's cores, since most of them
# wait on a deadline rather than compute, and `common::patience()` stretches
# the deadlines with the load that adds.

name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

# A newer push to the same branch or pull request makes an older run moot.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  fmt:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - run: cargo fmt --all --check

  clippy:
    name: Clippy (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-latest
          - name: macOS arm64
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: clippy
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Clippy without the net feature
        run: cargo clippy --locked --all-targets --no-default-features -- -D warnings

  test:
    name: Tests (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-latest
          - name: macOS arm64
            os: macos-latest
    runs-on: ${{ matrix.os }}
    env:
      RUST_TEST_THREADS: "8"
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: test
      - name: Tests
        # The test binaries (tests/it, the three that change their
        # environment, and the unit tests) each run whatever one before it
        # failed, so a run names every failure rather than the first binary's.
        run: cargo test --locked --no-fail-fast

  intel-mac:
    name: Build (macOS x86_64)
    if: ${{ !startsWith(github.ref, 'refs/heads/ci/land-') }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain and the Intel target
        run: |
          rustup toolchain install
          rustup target add x86_64-apple-darwin
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: intel-mac
      - run: cargo build --locked --target x86_64-apple-darwin
