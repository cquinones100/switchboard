# A release, from a version bump on main: the three targets built in release
# mode, each packed as switchboard-<version>-<target>.tar.gz
# (a folder of that name holding the binary) with its SHA-256 beside it in
# <archive>.sha256 and its signature in <archive>.sig, and all nine
# published as a GitHub release whose notes are the commits since the tag
# before (the newest of them and a link to the rest, past what GitHub
# takes). `switchboard update` and install.sh take the newest release's
# archive for their computer and refuse it unless its checksum matches and
# its signature is by a key in src/update/release-signing-keys.pub, whose
# public halves the binary and install.sh carry: a checksum published in
# the same release vouches only for a download that arrived whole, where
# the signature is made with a key the release's files can't change.
#
# The signature is OpenSSH's (`ssh-keygen -Y sign`, namespace
# switchboard-release), made in the publish job, on GitHub's own runner,
# with the private key in the RELEASE_SIGNING_KEY secret of the
# repository's `release` environment, which only main may deploy from
# (CLAUDE.md's release paragraph); a run without it, or with a key whose
# public half isn't listed, fails before anything is published. Runs start
# only from main, never from a pushed tag: a tag's run would take this file
# from the tagged commit, so whoever could push a tag could rewrite it to
# read the key, and the environment keeps the key from any run but main's. The actions
# are pinned by commit, so a tag moved in an action's repository changes
# nothing here.
#
# The version is Cargo.toml's `version` (the workspace's, the first line of
# the file that sets one, which the `switchboard`, `switchboard-ui` and
# `switchboard-plugin-api` crates take; the diff, crates/diff, and Notes,
# crates/notes, each have a version and releases of their own,
# release-diff.yml and release-notes.yml), which the binary compares
# (CARGO_PKG_VERSION) with the releases' to know when one is newer. Bump it
# in a commit of its own (`cargo check` updates Cargo.lock to match): once
# that commit is on main, the bump is the whole release. Every push to main
# runs the first job, which reads the version and looks for its release on
# GitHub. With the release there, as after any ordinary commit, nothing
# else runs. With none, the commit that set the version is built, tagged
# `v<version>` once every target has built (so a build that fails leaves no
# tag) and published; a version tagged and not published, by a run that
# failed after tagging, is built from its tag's commit and published by the
# next push to main, once main is checked to hold that commit. The
# commit is found from main's history rather than taken to be the one
# pushed, since the run of a bump waiting behind another release is dropped
# for the run of a commit pushed after it, which then makes the bump's
# release. The tag is made here, in the run that publishes. Runs go one at
# a time, so a push to main that follows a bump closely finds the bump's
# release published rather than making it a second time.
#
# The binaries are built with SWITCHBOARD_RELEASE set, which lets the
# server look for newer releases by itself (src/update); a binary built from
# a clone doesn't. Linux's is built in PyPA's manylinux_2_28 image, whose
# glibc is 2.28, so it starts on any distribution with that or newer (Ubuntu
# 20.04, Debian 10, RHEL 8 and on); built on a GitHub runner, it would need
# the runner's own glibc, newer than many distributions still in use have,
# and its first step running it there is the check that it starts on 2.28.

name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  version:
    name: Whether this commit is a release
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.version.outputs.release }}
      version: ${{ steps.version.outputs.version }}
      commit: ${{ steps.version.outputs.commit }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Main's history, to find the commit that set the version.
          fetch-depth: 0
      - id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cargo_version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          if [ -z "$cargo_version" ]; then
            echo "::error::Cargo.toml names no version."
            exit 1
          fi
          version="$cargo_version"
          # The commit its tag names, when it has one (the last line is
          # the commit of a tag with a message of its own). Asked on a
          # line of its own, so the job fails when GitHub can't be asked,
          # rather than taking that for no tag.
          tagged=$(git ls-remote origin "refs/tags/v$version" "refs/tags/v$version^{}")
          commit=$(printf '%s\n' "$tagged" | tail -n 1 | cut -f 1)
          if [ -z "$commit" ]; then
            # Else the one that set the version: the oldest of main's
            # latest commits to Cargo.toml that says it.
            commit=$(git rev-parse HEAD)
            for changed in $(git rev-list --first-parent HEAD -- Cargo.toml); do
              said=$(git show "$changed:Cargo.toml" | sed -n 's/^version = "\(.*\)"$/\1/p' | head -n 1)
              [ "$said" = "$version" ] || break
              commit="$changed"
            done
          fi
          # Only main's code is signed, whichever way the commit was found: a
          # tag pushed to a commit main doesn't hold would otherwise get the
          # release key's signature once main's Cargo.toml reaches its
          # version, without the commit reaching main.
          git fetch --no-tags origin "+refs/heads/main:refs/remotes/origin/main"
          if ! git merge-base --is-ancestor "$commit" origin/main; then
            echo "::error::v$version names $commit, which main doesn't hold; only main's commits are released."
            exit 1
          fi
          # Published already, as after any ordinary commit to main: nothing
          # to do. Only GitHub saying there is no such release counts as
          # none.
          release=true
          if found=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/v$version" --jq .tag_name 2>&1); then
            echo "::notice::Switchboard $version is already published."
            release=false
          else
            case "$found" in
              *"HTTP 404"*) ;;
              *) echo "::error::Couldn't ask GitHub for the release v$version: $found"; exit 1 ;;
            esac
          fi
          echo "Version $version, set by $commit: release=$release"
          {
            echo "release=$release"
            echo "version=$version"
            echo "commit=$commit"
          } >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.target }}
    needs: version
    if: needs.version.outputs.release == 'true'
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            container: quay.io/pypa/manylinux_2_28_x86_64
            native: true
          - target: aarch64-apple-darwin
            os: macos-latest
            native: true
          - target: x86_64-apple-darwin
            os: macos-latest
            native: false
    runs-on: ${{ matrix.os }}
    # Empty for the Macs, which build on the runner itself.
    container: ${{ matrix.container }}
    env:
      VERSION: ${{ needs.version.outputs.version }}
      TARGET: ${{ matrix.target }}
      SWITCHBOARD_RELEASE: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.version.outputs.commit }}
      - name: Install rustup in the container
        if: matrix.container
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          # The container runs as root over a checkout the runner's user
          # owns, which git refuses to read, checkout's own exception
          # having been for its steps alone; build.rs asks git for the
          # commit `switchboard --version` names.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Install the pinned toolchain and the target
        run: |
          rustup toolchain install
          rustup target add "$TARGET"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-registry-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
      - name: Build
        run: cargo build --locked --release --target "$TARGET" -p switchboard
      - name: Check it starts and names its version
        if: matrix.native
        run: |
          said=$("target/$TARGET/release/switchboard" --version)
          echo "$said"
          case "$said" in
            "switchboard $VERSION ("*) ;;
            *) echo "::error::It says '$said', not version $VERSION"; exit 1 ;;
          esac
      - name: Pack it with its checksum
        run: |
          name="switchboard-$VERSION-$TARGET"
          mkdir -p "dist/$name"
          cp "target/$TARGET/release/switchboard" "dist/$name/"
          cd dist
          tar -czf "$name.tar.gz" "$name"
          # The same `<hash>  <name>` line from either: the container has
          # sha256sum, a Mac shasum.
          if command -v sha256sum > /dev/null; then
            sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
          else
            shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
          fi
          cat "$name.tar.gz.sha256"
          rm -r "$name"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  tag:
    name: Tag the commit
    needs: [version, build]
    # The tag may be there already, from a run that failed after tagging.
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.version.outputs.version }}
      COMMIT: ${{ needs.version.outputs.commit }}
    steps:
      - name: Make the tag, or find it made on this commit
        run: |
          tag="v$VERSION"
          if gh api "repos/$GITHUB_REPOSITORY/git/refs" \
            -f "ref=refs/tags/$tag" -f "sha=$COMMIT" > /dev/null; then
            echo "Tagged $COMMIT as $tag."
            exit 0
          fi
          # One there already is the same release when it names this
          # commit (the last line is the commit
          # of a tag with a message of its own).
          tagged=$(git ls-remote "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY" \
            "refs/tags/$tag" "refs/tags/$tag^{}")
          there=$(printf '%s\n' "$tagged" | tail -n 1 | cut -f 1)
          if [ "$there" != "$COMMIT" ]; then
            echo "::error::Couldn't tag $COMMIT as $tag (the tag names '$there')."
            exit 1
          fi
          echo "$tag is already on $COMMIT."

  publish:
    name: Publish the release
    needs: [version, build, tag]
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.tag.result == 'success' }}
    runs-on: ubuntu-latest
    # The environment holds RELEASE_SIGNING_KEY and lets only main deploy, so
    # no run but main's can read the key.
    environment: release
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      COMMIT: ${{ needs.version.outputs.commit }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.version.outputs.commit }}
          # Every tag and commit, for the notes since the tag before.
          fetch-depth: 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true
      - name: Check every archive against its checksum
        run: |
          cd dist
          ls -l
          [ "$(ls *.tar.gz | wc -l)" -eq 3 ] || { echo "::error::Expected three archives"; exit 1; }
          sha256sum --check *.sha256
      - name: Sign every archive with the release key
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          if [ -z "$RELEASE_SIGNING_KEY" ]; then
            echo "::error::The RELEASE_SIGNING_KEY secret isn't set, so the release can't be signed (CLAUDE.md's release paragraph)."
            exit 1
          fi
          key="$RUNNER_TEMP/release-signing-key"
          (umask 077 && printf '%s\n' "$RELEASE_SIGNING_KEY" > "$key")
          signed=0
          ssh-keygen -Y sign -q -f "$key" -n switchboard-release dist/*.tar.gz && signed=1
          rm -f "$key"
          [ "$signed" = 1 ] || { echo "::error::Couldn't sign the archives."; exit 1; }
          # Checked against the keys the binary and install.sh carry, so a
          # secret that isn't one of them fails here rather than in every
          # update.
          awk 'NF >= 2 && $1 !~ /^#/ { printf "switchboard-release namespaces=\"switchboard-release\" %s %s\n", $1, $2 }' \
            src/update/release-signing-keys.pub > "$RUNNER_TEMP/allowed_signers"
          for archive in dist/*.tar.gz; do
            ssh-keygen -Y verify -f "$RUNNER_TEMP/allowed_signers" -I switchboard-release \
              -n switchboard-release -s "$archive.sig" < "$archive"
          done
      - name: Write the notes from the commits since the tag before
        run: |
          tag="v$VERSION"
          previous=$(git describe --tags --abbrev=0 --match 'v*' "$COMMIT^" 2>/dev/null || true)
          if [ -n "$previous" ]; then
            range="$previous..$COMMIT"
          else
            range="$COMMIT"
          fi
          git log --no-merges --format='- %s (%h)' "$range" > commits.md
          # GitHub refuses notes over 125,000 characters, and the first
          # release's list is the whole history: a list past the limit keeps
          # its newest commits (whole lines) and links to the rest.
          limit=60000
          {
            if [ -n "$previous" ]; then
              echo "Changes since $previous:"
            else
              echo "The first release."
            fi
            echo
            if [ "$(wc -c < commits.md)" -le "$limit" ]; then
              cat commits.md
            else
              head -c "$limit" commits.md | sed '$d' > kept.md
              cat kept.md
              echo "- …and $(( $(wc -l < commits.md) - $(wc -l < kept.md) )) earlier commits: https://github.com/$GITHUB_REPOSITORY/commits/$tag"
            fi
          } > notes.md
          cat notes.md
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION" dist/* \
            --title "Switchboard $VERSION" \
            --notes-file notes.md \
            --verify-tag
