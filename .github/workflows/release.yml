# A release, from a version bump on main: the three targets built in release
# mode, each packed as switchboard-<version>-<target>.tar.gz
# (a folder of that name holding the binary) with its SHA-256 beside it in
# <archive>.sha256, and all six published as a GitHub release whose notes are
# the commits since the tag before (the newest of them and a link to the
# rest, past what GitHub takes). `switchboard update` and install.sh take
# the newest release's archive for their computer and refuse it unless its
# checksum matches.
#
# The version is Cargo.toml's `version`, which the binary compares
# (CARGO_PKG_VERSION) with the releases' to know when one is newer. Bump it
# in a commit of its own (`cargo check` updates Cargo.lock to match): once
# that commit is on main, the bump is the whole release. Every push to main
# runs the first job, which reads the version and looks for its release on
# GitHub. With the release there, as after any ordinary commit, nothing
# else runs. With none, the commit that set the version is built, tagged
# `v<version>` once every target has built (so a build that fails leaves no
# tag) and published; a version tagged and not published, by a run that
# failed after tagging or a tag pushed by hand whose run was dropped, is
# built from its tag's commit and published by the next push to main. The
# commit is found from main's history rather than taken to be the one
# pushed, since the run of a bump waiting behind another release is dropped
# for the run of a commit pushed after it, which then makes the bump's
# release. The run of a tag pushed by hand for another version than main's
# can be dropped the same way, and is run again from GitHub's Actions page. The tag is made here, in the run that
# publishes, since one a workflow pushes with its own token starts no other
# workflow.
#
# A tag pushed by hand (`git tag v0.2.0 && git push origin v0.2.0`) still
# releases its commit: one that disagrees with Cargo.toml fails the first
# job, and one whose release is already published builds nothing. Runs go
# one at a time, so a push to main that follows a bump closely finds the
# bump's release published rather than making it a second time.
#
# The binaries are built with SWITCHBOARD_RELEASE set, which lets the
# server look for newer releases by itself (src/update); a binary built from
# a clone doesn't. Linux's is built in PyPA's manylinux_2_28 image, whose
# glibc is 2.28, so it starts on any distribution with that or newer (Ubuntu
# 20.04, Debian 10, RHEL 8 and on); built on a GitHub runner, it would need
# the runner's own glibc, newer than many distributions still in use have,
# and its first step running it there is the check that it starts on 2.28.

name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  version:
    name: Whether this commit is a release
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.version.outputs.release }}
      version: ${{ steps.version.outputs.version }}
      commit: ${{ steps.version.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Main's history, to find the commit that set the version.
          fetch-depth: 0
      - id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cargo_version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          if [ -z "$cargo_version" ]; then
            echo "::error::Cargo.toml names no version."
            exit 1
          fi
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            version="${GITHUB_REF_NAME#v}"
            if [ "$version" != "$cargo_version" ]; then
              echo "::error::The tag says $version and Cargo.toml says $cargo_version; bump Cargo.toml and tag that commit."
              exit 1
            fi
            commit=$(git rev-parse HEAD)
          else
            version="$cargo_version"
            # The commit its tag names, when it has one (the last line is
            # the commit of a tag with a message of its own). Asked on a
            # line of its own, so the job fails when GitHub can't be asked,
            # rather than taking that for no tag.
            tagged=$(git ls-remote origin "refs/tags/v$version" "refs/tags/v$version^{}")
            commit=$(printf '%s\n' "$tagged" | tail -n 1 | cut -f 1)
            if [ -z "$commit" ]; then
              # Else the one that set the version: the oldest of main's
              # latest commits to Cargo.toml that says it.
              commit=$(git rev-parse HEAD)
              for changed in $(git rev-list --first-parent HEAD -- Cargo.toml); do
                said=$(git show "$changed:Cargo.toml" | sed -n 's/^version = "\(.*\)"$/\1/p' | head -n 1)
                [ "$said" = "$version" ] || break
                commit="$changed"
              done
            fi
          fi
          # Published already, as after any ordinary commit to main: nothing
          # to do. Only GitHub saying there is no such release counts as
          # none.
          release=true
          if found=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/v$version" --jq .tag_name 2>&1); then
            echo "::notice::Switchboard $version is already published."
            release=false
          else
            case "$found" in
              *"HTTP 404"*) ;;
              *) echo "::error::Couldn't ask GitHub for the release v$version: $found"; exit 1 ;;
            esac
          fi
          echo "Version $version, set by $commit: release=$release"
          {
            echo "release=$release"
            echo "version=$version"
            echo "commit=$commit"
          } >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.target }}
    needs: version
    if: needs.version.outputs.release == 'true'
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            container: quay.io/pypa/manylinux_2_28_x86_64
            native: true
          - target: aarch64-apple-darwin
            os: macos-latest
            native: true
          - target: x86_64-apple-darwin
            os: macos-latest
            native: false
    runs-on: ${{ matrix.os }}
    # Empty for the Macs, which build on the runner itself.
    container: ${{ matrix.container }}
    env:
      VERSION: ${{ needs.version.outputs.version }}
      TARGET: ${{ matrix.target }}
      SWITCHBOARD_RELEASE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.commit }}
      - name: Install rustup in the container
        if: matrix.container
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          # The container runs as root over a checkout the runner's user
          # owns, which git refuses to read, checkout's own exception
          # having been for its steps alone; build.rs asks git for the
          # commit `switchboard --version` names.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Install the pinned toolchain and the target
        run: |
          rustup toolchain install
          rustup target add "$TARGET"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-registry-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
      - name: Build
        run: cargo build --locked --release --target "$TARGET"
      - name: Check it starts and names its version
        if: matrix.native
        run: |
          said=$("target/$TARGET/release/switchboard" --version)
          echo "$said"
          case "$said" in
            "switchboard $VERSION ("*) ;;
            *) echo "::error::It says '$said', not version $VERSION"; exit 1 ;;
          esac
      - name: Pack it with its checksum
        run: |
          name="switchboard-$VERSION-$TARGET"
          mkdir -p "dist/$name"
          cp "target/$TARGET/release/switchboard" "dist/$name/"
          cd dist
          tar -czf "$name.tar.gz" "$name"
          # The same `<hash>  <name>` line from either: the container has
          # sha256sum, a Mac shasum.
          if command -v sha256sum > /dev/null; then
            sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
          else
            shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
          fi
          cat "$name.tar.gz.sha256"
          rm -r "$name"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  tag:
    name: Tag the commit
    needs: [version, build]
    # A tag pushed by hand is there already; on main, so may this one be.
    if: needs.version.outputs.release == 'true' && github.ref_type == 'branch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.version.outputs.version }}
      COMMIT: ${{ needs.version.outputs.commit }}
    steps:
      - name: Make the tag, or find it made on this commit
        run: |
          tag="v$VERSION"
          if gh api "repos/$GITHUB_REPOSITORY/git/refs" \
            -f "ref=refs/tags/$tag" -f "sha=$COMMIT" > /dev/null; then
            echo "Tagged $COMMIT as $tag."
            exit 0
          fi
          # One there already is the same release when it names this
          # commit (the last line is the commit
          # of a tag with a message of its own).
          tagged=$(git ls-remote "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY" \
            "refs/tags/$tag" "refs/tags/$tag^{}")
          there=$(printf '%s\n' "$tagged" | tail -n 1 | cut -f 1)
          if [ "$there" != "$COMMIT" ]; then
            echo "::error::Couldn't tag $COMMIT as $tag (the tag names '$there')."
            exit 1
          fi
          echo "$tag is already on $COMMIT."

  publish:
    name: Publish the release
    needs: [version, build, tag]
    # The tag job is skipped for a tag pushed by hand, which would skip this
    # one with it.
    if: ${{ !cancelled() && needs.build.result == 'success' && (needs.tag.result == 'success' || needs.tag.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      COMMIT: ${{ needs.version.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.commit }}
          # Every tag and commit, for the notes since the tag before.
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Check every archive against its checksum
        run: |
          cd dist
          ls -l
          [ "$(ls *.tar.gz | wc -l)" -eq 3 ] || { echo "::error::Expected three archives"; exit 1; }
          sha256sum --check *.sha256
      - name: Write the notes from the commits since the tag before
        run: |
          tag="v$VERSION"
          previous=$(git describe --tags --abbrev=0 --match 'v*' "$COMMIT^" 2>/dev/null || true)
          if [ -n "$previous" ]; then
            range="$previous..$COMMIT"
          else
            range="$COMMIT"
          fi
          git log --no-merges --format='- %s (%h)' "$range" > commits.md
          # GitHub refuses notes over 125,000 characters, and the first
          # release's list is the whole history: a list past the limit keeps
          # its newest commits (whole lines) and links to the rest.
          limit=60000
          {
            if [ -n "$previous" ]; then
              echo "Changes since $previous:"
            else
              echo "The first release."
            fi
            echo
            if [ "$(wc -c < commits.md)" -le "$limit" ]; then
              cat commits.md
            else
              head -c "$limit" commits.md | sed '$d' > kept.md
              cat kept.md
              echo "- …and $(( $(wc -l < commits.md) - $(wc -l < kept.md) )) earlier commits: https://github.com/$GITHUB_REPOSITORY/commits/$tag"
            fi
          } > notes.md
          cat notes.md
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION" dist/* \
            --title "Switchboard $VERSION" \
            --notes-file notes.md \
            --verify-tag
