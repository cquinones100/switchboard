<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Grid fixture</title><script src="./support.js"></script></head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
.scr{font-family:ui-monospace,monospace;font-size:13px;line-height:17px;white-space:pre}
.ln{height:17px;overflow:hidden}
.kitty{position:absolute;left:0;top:0;width:0;height:0}
</style>
</helmet>
<div class="scr" style="width:1280px;height:800px;box-sizing:border-box;padding:16px;background:#0b0c12;overflow:hidden;position:relative">
<div style="position:relative;display:inline-block;background:#15161e">
<sc-for list="{{rows}}" as="row" hint-placeholder-count="45"><div class="ln"><sc-for list="{{row.runs}}" as="r" hint-placeholder-count="6"><span style="{{r.style}}">{{r.text}}</span></sc-for></div></sc-for>
<div class="kitty"><sc-for list="{{imgs}}" as="im" hint-placeholder-count="0"><div style="{{im.pos}}"><div style="{{im.style}}">{{im.text}}</div></div></sc-for></div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
renderVals() {
const rows = [];
for (let y = 0; y < 45; y++) rows.push({ runs: [
  { text: ' ' + String(y + 1).padStart(2) + ' ', style: 'color:#8d93a8;background:#11121a' },
  { text: (y % 3 === 0 ? '● needs you <tab ' + y + '>' : '⠹ working on tab ' + y).padEnd(155), style: 'color:' + (y % 3 === 0 ? '#f2c56b' : '#82aaff') + ';background:#15161e' }
] });
return { rows: rows, imgs: [{ pos: 'position:absolute;left:calc(100ch);top:170px;width:calc(40ch);height:170px', style: 'width:100%;height:100%;border-radius:7px;background:#262b40', text: '' }] };
}
}
</script>
</body>
</html>
